# 固定项目名：服务器上还跑着其他 compose 项目，不固定会按目录名生成同前缀容器/网络，
# 出现 mychat 与既有服务的资源互相覆盖
name: mychat

services:
  postgres:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    # 2C2G 机器：默认 shared_buffers 128MB 之外的内存留给 OS 与其他既有服务，
    # 不限制时 pg 会按物理内存比例再申请 work_mem，与同机其他业务争抢导致 OOM
    command: postgres -c shared_buffers=96MB -c work_mem=4MB -c max_connections=40
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    # 仅绑定本机回环，供 SSH 隧道跑 drizzle push 用，不对公网暴露
    ports:
      - '127.0.0.1:5444:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER}']
      interval: 5s
      timeout: 3s
      retries: 12

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
    # 不再对公网直接暴露 80：站点统一由 caddy 前置（443 提供 HTTPS，80 跳 HTTPS）。
    # 只有 expose 时端口仅存在于 compose 内部网络，外部扫描不到明文 HTTP。
    expose:
      - '3000'
    # 语音消息音频落盘目录（server/uploads/audio）：挂卷避免重建容器后历史语音消息 404
    volumes:
      - audio_uploads:/app/server/uploads/audio
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    # 只发布 443：这台轻量服务器的 80 已被宿主机上的 Caddy 占用（服务其他站点），
    # 容器再绑 80 会直接起不来。HTTP→HTTPS 跳转因此不可用，需用 https:// 显式访问。
    ports:
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # 自签证书（含 IP SAN）只在服务器上生成，不入库：
      # openssl req -x509 -newkey rsa:2048 -sha256 -days 825 -nodes \
      #   -keyout certs/site.key -out certs/site.crt -subj "/CN=my-chat-lhins" \
      #   -addext "subjectAltName=IP:43.139.238.226,DNS:localhost"
      - ./certs:/etc/caddy/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  audio_uploads:
  caddy_data:
  caddy_config:
